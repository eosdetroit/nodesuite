---
- hosts: '{{ target }}'
  environment:
    WORKSHOP_PATH: "{{ workshop_path }}"
    FABRIC_CFG_PATH: "{{ workshop_path }}/config"
    WORKSHOP_INGRESS_DOMAIN: "{{ workshop_ingress_domain }}"
    WORKSHOP_NAMESPACE: "{{ workshop_namespace }}"
    WORKSHOP_CRYPTO: "{{ workshop_crypto }}"
    ORG1_PEER1_ADDRESS: "{{ workshop_namespace }}-org1-peer1-peer.{{ workshop_ingress_domain }}:443"
    ORG1_PEER2_ADDRESS: "{{ workshop_namespace }}-org1-peer2-peer.{{ workshop_ingress_domain }}:443"
    CORE_PEER_LOCALMSPID: Org1MSP
    CORE_PEER_ADDRESS: "{{ workshop_namespace }}-org1-peer1-peer.{{ workshop_ingress_domain }}:443"
    CORE_PEER_TLS_ENABLED: true
    CORE_PEER_MSPCONFIGPATH: "{{ workshop_crypto }}/enrollments/org1/users/org1admin/msp"
    CORE_PEER_TLS_ROOTCERT_FILE: "{{ workshop_crypto }}/channel-msp/peerOrganizations/org1/msp/tlscacerts/tlsca-signcert.pem"
    CORE_PEER_CLIENT_CONNTIMEOUT: 15s
    CORE_PEER_DELIVERYCLIENT_CONNTIMEOUT: 15s
    ORDERER_ENDPOINT: "{{ workshop_namespace }}-org0-orderersnode1-orderer.{{ workshop_ingress_domain }}:443"
    ORDERER_TLS_CERT: "{{ workshop_crypto }}/channel-msp/ordererOrganizations/org0/orderers/org0-orderersnode1/tls/signcerts/tls-cert.pem"
    CHANNEL_NAME: "mychannel"
    VERSION: "v0.1.3"
    SEQUENCE: 1
    CHAINCODE_NAME: "asset-transfer"
    CHAINCODE_PACKAGE: "asset-transfer-typescript-v0.1.3.tgz"
    PATH: "{{ workshop_path }}/bin:{{ ansible_env.PATH }}"
    MSP_ID: Org1MSP
    ORG: org1
    USERNAME: org1user
    PASSWORD: org1userpw
    ADMIN_MSP_DIR: "{{ workshop_crypto }}/enrollments/org1/users/rcaadmin/msp"
    USER_MSP_DIR: "{{ workshop_crypto }}/enrollments/org1/users/org1user/msp"
    PEER_MSP_DIR: "{{ workshop_crypto }}/channel-msp/peerOrganizations/org1/msp"
    PRIVATE_KEY: "{{ workshop_crypto }}/enrollments/org1/users/org1user/msp/keystore/key.pem"
    CERTIFICATE: "{{ workshop_crypto }}/enrollments/org1/users/org1user/msp/signcerts/cert.pem"
    TLS_CERT: "{{ workshop_crypto }}/channel-msp/peerOrganizations/org1/msp/tlscacerts/tlsca-signcert.pem"
    HOST_ALIAS: "{{ workshop_namespace }}-org1-peer1-peer.{{ workshop_ingress_domain }}"
    ENDPOINT: "{{ workshop_namespace }}-org1-peer1-peer.{{ workshop_ingress_domain }}:443"
  strategy: free
  become: yes
  become_user: root
  gather_facts: false
  roles:
    - { role: fabric_install }
    - { role: fabric_justfiles }
    - { role: fabric_trader_app }